name: concert-ops

services:
  postgres:
    image: postgres:17.2
    container_name: concert-ops-postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-exporter-ticketing:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: concert-ops-postgres-exporter-ticketing
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
    environment:
      DATA_SOURCE_NAME: postgresql://${EXPORTER_DB_USER}:${EXPORTER_DB_PASSWORD}@postgres:5432/${TICKETING_DB_NAME}?sslmode=disable
    ports:
      - "${POSTGRES_EXPORTER_TICKETING_PORT}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-catalog:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: concert-ops-postgres-exporter-catalog
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
    environment:
      DATA_SOURCE_NAME: postgresql://${EXPORTER_DB_USER}:${EXPORTER_DB_PASSWORD}@postgres:5432/${CATALOG_DB_NAME}?sslmode=disable
    ports:
      - "${POSTGRES_EXPORTER_CATALOG_PORT}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: concert-ops-rabbitmq
    hostname: rabbitmq
    command: >
      bash -lc "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT}:15692"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-auth
    command: ["node", "dist/services/auth/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: auth
      AUTH_PORT: 3000
      AUTH_DB_PATH: /app/data/auth.db
      AUTH_TOKEN_TTL_MS: ${AUTH_TOKEN_TTL_MS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - authdata:/app/data
    ports:
      - "${AUTH_HOST_PORT}:3000"
    restart: unless-stopped

  notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-notify
    command: ["node", "dist/services/notify/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: notify
      NOTIFY_PORT: 3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:5672
    depends_on:
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-ticketing
    command: ["node", "dist/services/ticketing/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: ticketing
      DB_HOST: postgres
      DB_PORT: 5432
      TICKETING_DB_NAME: ${TICKETING_DB_NAME}
      TICKETING_DB_USER: ${TICKETING_DB_USER}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD}
      TICKETING_PORT: 3000
      CATALOG_BASE_URL: http://catalog:3000
      AUTH_BASE_URL: http://auth:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      HOLD_TTL_MS: ${HOLD_TTL_MS}
      HOLD_SWEEP_INTERVAL_MS: ${HOLD_SWEEP_INTERVAL_MS}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:5672
    ports:
      - "${TICKETING_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      catalog:
        condition: service_started
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-catalog
    command: ["node", "dist/services/catalog/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: catalog
      DB_HOST: postgres
      DB_PORT: 5432
      CATALOG_DB_NAME: ${CATALOG_DB_NAME}
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      CATALOG_PORT: 3000
      AUTH_BASE_URL: http://auth:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${CATALOG_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: concert-ops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: concert-ops-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.route-prefix=/'
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    depends_on:
      - ticketing
      - catalog
      - auth
      - alertmanager
      - rabbitmq
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: concert-ops-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT}:9093"
    depends_on:
      - notify
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: concert-ops-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_HOST_PORT}:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: concert-ops-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./infra/loki/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    container_name: concert-ops-tempo
    command: -config.file=/etc/tempo.yml
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo.yml:ro
      - tempodata:/var/tempo
    ports:
      - "${TEMPO_HOST_PORT}:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.90.0
    container_name: concert-ops-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/tempo/otel-collector-config.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT}:4318"
    depends_on:
      - tempo
    restart: unless-stopped

volumes:
  pgdata:
  authdata:
  promdata:
  alertmanagerdata:
  rabbitmqdata:
  grafanadata:
  lokidata:
  alloydata:
  tempodata:
