name: concert-ops

services:
  postgres:
    image: postgres:17.2
    container_name: concert-ops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-auth
    command: ["node", "dist/services/auth/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: auth
      AUTH_PORT: 3000
      AUTH_DB_PATH: /app/data/auth.db
      AUTH_TOKEN_TTL_MS: ${AUTH_TOKEN_TTL_MS}
    volumes:
      - authdata:/app/data
    ports:
      - "${AUTH_HOST_PORT}:3000"
    restart: unless-stopped

  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-ticketing
    command: ["node", "dist/services/ticketing/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: ticketing
      DB_HOST: postgres
      DB_PORT: 5432
      TICKETING_DB_NAME: ${TICKETING_DB_NAME}
      TICKETING_DB_USER: ${TICKETING_DB_USER}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD}
      TICKETING_PORT: 3000
      CATALOG_BASE_URL: http://catalog:3000
      AUTH_BASE_URL: http://auth:3000
      HOLD_TTL_MS: ${HOLD_TTL_MS}
      HOLD_SWEEP_INTERVAL_MS: ${HOLD_SWEEP_INTERVAL_MS}
    ports:
      - "${TICKETING_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      catalog:
        condition: service_started
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concert-ops-catalog
    command: ["node", "dist/services/catalog/server.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      SERVICE_NAME: catalog
      DB_HOST: postgres
      DB_PORT: 5432
      CATALOG_DB_NAME: ${CATALOG_DB_NAME}
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      CATALOG_PORT: 3000
      AUTH_BASE_URL: http://auth:3000
    ports:
      - "${CATALOG_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: concert-ops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: concert-ops-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.route-prefix=/'
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    depends_on:
      - ticketing
      - catalog
      - auth
    restart: unless-stopped

volumes:
  pgdata:
  authdata:
  promdata:
  grafanadata:
