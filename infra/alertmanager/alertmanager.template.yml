global:
  smtp_smarthost: '__SMTP_HOST__:__SMTP_PORT__'
  smtp_from: '__SMTP_FROM__'
  smtp_auth_username: '__SMTP_USER__'
  smtp_auth_password: '__SMTP_PASSWORD__'
  smtp_require_tls: __SMTP_REQUIRE_TLS__

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 1h
  receiver: 'gmail-receiver'

receivers:
  - name: 'gmail-receiver'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
    webhook_configs:
      - send_resolved: true
        url: http://notify:3000/alerts
