global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: monitoring

  - job_name: 'ticketing'
    static_configs:
      - targets: ['ticketing:3000']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: service
          team: backend

  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:3000']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: service
          team: backend

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3000']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: service
          team: backend

  - job_name: 'notify'
    static_configs:
      - targets: ['notify:3000']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: service
          team: backend

  - job_name: 'postgres-ticketing'
    static_configs:
      - targets: ['postgres-exporter-ticketing:9187']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: database
          team: platform

  - job_name: 'postgres-catalog'
    static_configs:
      - targets: ['postgres-exporter-catalog:9187']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: database
          team: platform

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          instance_group: concert-ops
          instance_env: lab
          instance_type: broker
          team: platform

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']
