global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'ticketing'
    static_configs:
      - targets: ['ticketing:3000']

  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:3000']

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3000']

  - job_name: 'postgres-ticketing'
    static_configs:
      - targets: ['postgres-exporter-ticketing:9187']

  - job_name: 'postgres-catalog'
    static_configs:
      - targets: ['postgres-exporter-catalog:9187']
