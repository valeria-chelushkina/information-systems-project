global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          instance_type: monitoring

  - job_name: 'ticketing'
    static_configs:
      - targets: ['ticketing:3000']
        labels:
          instance_type: service

  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:3000']
        labels:
          instance_type: service

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3000']
        labels:
          instance_type: service

  - job_name: 'notify'
    static_configs:
      - targets: ['notify:3000']
        labels:
          instance_type: service

  - job_name: 'web'
    static_configs:
      - targets: ['web:3000']
        labels:
          instance_type: service

  - job_name: 'postgres-ticketing'
    static_configs:
      - targets: ['postgres-exporter-ticketing:9187']
        labels:
          instance_type: database

  - job_name: 'postgres-catalog'
    static_configs:
      - targets: ['postgres-exporter-catalog:9187']
        labels:
          instance_type: database

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          instance_type: broker

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_type: host

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']
