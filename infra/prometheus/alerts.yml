groups:
  - name: default
    rules:
      - alert: ServiceDown
        expr: up{instance_type='service'} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} has been down for more than 5 minutes"

      - alert: DatabaseExporterDown
        expr: up{instance_type='database'} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter {{ $labels.instance }} has been down for more than 5 minutes"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter {{ $labels.instance }} cannot reach the database"

      - alert: ServiceError
        expr: floor(sum by (service) (increase(http_requests_total{status=~'5..'}[1m]))) > 0
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} has just thrown 5xx errors"

      - alert: HighLatency
        expr: service:http_request_duration_p95:15m > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} has p95 latency above 1s for more than 5 minutes"

      - alert: DbPoolSaturated
        expr: db_pool_waiting_requests > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} has requests waiting for a database connection"

      - alert: PostgresHighConnections
        expr: postgres:connections:percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database {{ $labels.datname }} is using more than 80% of max_connections"

      - alert: PostgresLowCacheHit
        expr: postgres:cache_hit:percent5m < 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres cache hit ratio is below 90% for more than 10 minutes"

      - alert: PostgresDeadlocks
        expr: floor(sum(increase(pg_stat_database_deadlocks{datname=~'db_.*'}[5m]))) > 0
        labels:
          severity: critical
        annotations:
          summary: "Postgres has detected a deadlock"

      - alert: RabbitmqDown
        expr: up{instance_type='broker'} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ {{ $labels.instance }} has been down for more than 2 minutes"

      - alert: RabbitmqQueueBacklog
        expr: rabbitmq:queue_backlog > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ has more than 100 ready messages"

      - alert: RabbitmqNoConsumers
        expr: rabbitmq_queue_consumers == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ has no active consumers"

      - alert: RabbitmqPublishFailures
        expr: increase(rabbitmq_publish_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} failed to publish a RabbitMQ message"

      - alert: NoEventsOnSale
        expr: events_total{status='on_sale'} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No events are currently on sale"

      - alert: RefundRateHigh
        expr: 100 * sum(increase(refunds_total[1h])) / sum(increase(purchases_total{status='ok'}[1h])) > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than 20% of paid orders were refunded in the last hour"

      - alert: PurchaseFailures
        expr: floor(sum by (service) (increase(purchases_total{status='failed'}[5m]))) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} has failed purchase attempts"

      - alert: AuthFailureSpike
        expr: sum by (service) (rate(auth_failures_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} is seeing more than one authentication failure per second"
